services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  management-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      MANAGEMENT_API_URL: http://management-api:4000
    depends_on:
      - management-api

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://management-api:4000
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      - management-api

  users-service:
    build:
      context: ./examples/users-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"

  orders-service:
    build:
      context: ./examples/orders-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      PORT: "5002"

volumes:
  pgdata:

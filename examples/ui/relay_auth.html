<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELAY_ — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: #E5E5E2;
    --border-strong: #D8D8D4;
    --text: #111111;
    --text-secondary: #737373;
    --text-tertiary: #A3A3A0;
    --green: #16A34A;
    --green-dim: #ECFAF0;
    --red: #DC2626;
    --red-dim: #FDECEC;
    --yellow: #C88A04;
    --yellow-dim: #FBF3DE;
    --blue: #1D6FCE;
    --radius: 6px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; height:100%; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  .pixel{ font-family:'Silkscreen','JetBrains Mono',monospace; }

  /* ---- background: faint dot grid, fading out behind the card so it reads as texture, not decoration ---- */
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(circle at 50% 38%, transparent 0, transparent 200px, black 480px);
    mask-image: radial-gradient(circle at 50% 38%, transparent 0, transparent 200px, black 480px);
  }

  /* ---- shared component styles (match dashboard tokens exactly) ---- */
  .panel{ border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
  .btn{ height:36px; padding:0 14px; border-radius:var(--radius); font-size:12.5px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent; background:none; width:100%; }
  .btn-primary{ background:var(--text); color:#fff; }
  .btn-primary:hover{ background:#2b2b2b; }
  .btn-primary:disabled{ background:var(--text-tertiary); cursor:default; }
  .btn-secondary{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .btn-secondary:hover{ border-color:var(--border-strong); background:rgba(0,0,0,.015); }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:500; margin-bottom:6px; }
  .field .hint{ font-size:11.5px; color:var(--text-tertiary); margin-top:5px; }
  .field input{ width:100%; height:34px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:0 10px; font-size:12.5px; font-family:inherit; color:var(--text); }
  .field input:focus{ outline:none; border-color:var(--border-strong); }
  .field input::placeholder{ color:var(--text-tertiary); }
  .field-label-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .field-label-row label{ margin-bottom:0; }

  /* ---- auth layout ---- */
  .auth-shell{ position:relative; z-index:1; min-height:100%; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .auth-box{ width:100%; max-width:360px; }
  .auth-logo{ font-size:16px; font-weight:700; text-align:center; margin-bottom:28px; }
  .auth-head{ text-align:center; margin-bottom:22px; }
  .auth-title{ font-size:18px; font-weight:700; margin-bottom:6px; }
  .auth-sub{ font-size:12.5px; color:var(--text-secondary); }

  .auth-panel{ padding:22px; }
  .oauth-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .oauth-row .btn svg{ flex-shrink:0; }

  .divider{ display:flex; align-items:center; gap:10px; margin:18px 0; }
  .divider .line{ flex:1; height:1px; background:var(--border); }
  .divider span{ font-size:11.5px; color:var(--text-tertiary); }

  .auth-forgot{ font-size:11.5px; color:var(--text-secondary); }
  .auth-forgot:hover{ color:var(--text); text-decoration:underline; }

  .auth-submit{ margin-top:4px; }

  .auth-switch{ text-align:center; font-size:12.5px; color:var(--text-secondary); margin-top:20px; }
  .auth-switch a{ color:var(--text); font-weight:500; cursor:pointer; }
  .auth-switch a:hover{ text-decoration:underline; }

  .auth-terms{ text-align:center; font-size:11px; color:var(--text-tertiary); margin-top:16px; line-height:1.5; }
  .auth-terms a{ color:var(--text-secondary); }
  .auth-terms a:hover{ color:var(--text); text-decoration:underline; }

  .auth-error{ display:none; font-size:12px; color:var(--red); background:var(--red-dim); border:1px solid #F5C6C6; border-radius:var(--radius); padding:8px 10px; margin-bottom:14px; }
  .auth-error.show{ display:block; }

  @media (max-width:420px){
    .auth-shell{ padding:24px 16px; }
    .auth-panel{ padding:18px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="auth-shell">
  <div class="auth-box">
    <div class="auth-logo pixel">RELAY_</div>

    <div class="auth-head">
      <div class="auth-title pixel" id="authTitle">SIGN IN</div>
      <div class="auth-sub" id="authSub">Sign in to acme-workspace</div>
    </div>

    <div class="panel auth-panel">
      <div class="oauth-row">
        <button type="button" class="btn btn-secondary">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          Continue with GitHub
        </button>
        <button type="button" class="btn btn-secondary">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M15.68 8.18c0-.58-.05-1.13-.15-1.66H8v3.14h4.3a3.68 3.68 0 0 1-1.6 2.42v2h2.58c1.51-1.39 2.4-3.44 2.4-5.9Z"/><path d="M8 16c2.16 0 3.97-.71 5.29-1.92l-2.58-2c-.72.48-1.63.76-2.71.76-2.08 0-3.85-1.4-4.48-3.29H.86v2.07A8 8 0 0 0 8 16Z"/><path d="M3.52 9.55A4.8 4.8 0 0 1 3.27 8c0-.54.09-1.06.25-1.55V4.38H.86A8 8 0 0 0 0 8c0 1.29.31 2.51.86 3.62l2.66-2.07Z"/><path d="M8 3.16c1.17 0 2.23.4 3.06 1.19l2.29-2.29A7.94 7.94 0 0 0 8 0 8 8 0 0 0 .86 4.38l2.66 2.07C4.15 4.56 5.92 3.16 8 3.16Z"/></svg>
          Continue with Google
        </button>
      </div>

      <div class="divider"><div class="line"></div><span>or</span><div class="line"></div></div>

      <div class="auth-error" id="authError">Incorrect email or password.</div>

      <form id="authForm" onsubmit="return handleSubmit(event)">
        <div class="field auth-only-signup" style="display:none;">
          <label>Workspace name</label>
          <input type="text" placeholder="acme-workspace" id="fWorkspace">
        </div>
        <div class="field auth-only-signup" style="display:none;">
          <label>Full name</label>
          <input type="text" placeholder="Maya Gomez" id="fName">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" placeholder="you@company.com" id="fEmail" required>
        </div>
        <div class="field">
          <div class="field-label-row">
            <label>Password</label>
            <a class="auth-forgot auth-only-signin" id="forgotLink" href="#">Forgot password?</a>
          </div>
          <input type="password" placeholder="••••••••" id="fPassword" required>
          <div class="hint auth-only-signup" id="pwHint" style="display:none;">Minimum 8 characters, one number.</div>
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="authSubmit">Sign in</button>
      </form>
    </div>

    <div class="auth-switch" id="authSwitch">Don't have an account? <a onclick="setMode('signup')">Sign up</a></div>
    <div class="auth-terms" id="authTerms" style="display:none;">By creating an account, you agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</div>
  </div>
</div>

<script>
  function setMode(mode){
    const isSignup = mode === 'signup';
    document.getElementById('authTitle').textContent = isSignup ? 'CREATE ACCOUNT' : 'SIGN IN';
    document.getElementById('authSub').textContent = isSignup ? 'Set up a new workspace' : 'Sign in to acme-workspace';
    document.querySelectorAll('.auth-only-signup').forEach(el=> el.style.display = isSignup ? 'block' : 'none');
    document.getElementById('pwHint').style.display = isSignup ? 'block' : 'none';
    document.querySelectorAll('.auth-only-signin').forEach(el=> el.style.display = isSignup ? 'none' : 'inline');
    document.getElementById('authSubmit').textContent = isSignup ? 'Create account' : 'Sign in';
    document.getElementById('authTerms').style.display = isSignup ? 'block' : 'none';
    document.getElementById('authSwitch').innerHTML = isSignup
      ? `Already have an account? <a onclick="setMode('signin')">Sign in</a>`
      : `Don't have an account? <a onclick="setMode('signup')">Sign up</a>`;
    document.getElementById('authError').classList.remove('show');
    document.getElementById('fWorkspace').required = isSignup;
    document.getElementById('fName').required = isSignup;
  }

  function handleSubmit(e){
    e.preventDefault();
    // wire up to real auth here
    return false;
  }
</script>
</body>
</html>
